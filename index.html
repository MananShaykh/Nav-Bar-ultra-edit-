<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UltraEdit Navbar</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="header">
    <div class="box">

      <div class="logo">
        <div class="logo-badge">UE</div>
        <div class="logo-text">
          <span class="name">UltraEdit</span>
          <span class="tagline">By Embarcadero</span>
        </div>
      </div>

      <nav class="list-items">
        <ul>
          <li>
            <a href="/">
              Products
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M6 9l6 6 6-6"></path>
              </svg>
            </a>
          </li>
          <li><a href="/">Buy</a></li>
          <li><a href="/">Renew</a></li>
          <li>
            <a href="/">
              Support
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M6 9l6 6 6-6"></path>
              </svg>
            </a>
          </li>
          <li>
            <a href="/">
              Learn
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M6 9l6 6 6-6"></path>
              </svg>
            </a>
          </li>
          <li class="active">
            <a href="/">
              Company
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M6 9l6 6 6-6"></path>
              </svg>
            </a>
          </li>
        </ul>
      </nav>

      <div class="info">
        <a href="/" class="download-btn">Download</a>
        <a href="/" class="lang-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
            <circle cx="12" cy="12" r="9"></circle>
            <path d="M3 12h18M12 3c2.5 2.7 4 6 4 9s-1.5 6.3-4 9c-2.5-2.7-4-6-4-9s1.5-6.3 4-9z"></path>
          </svg>
          English
        </a>
        <button class="search-btn" aria-label="Search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="7"></circle>
            <path d="M21 21l-4.35-4.35"></path>
          </svg>
        </button>
      </div>

    </div>
  </header>

</body>
</html>
